# Jen testovací data (repo pavla, složka demo/): true = testovací položka. Ve skutečném obsahu být nesmí.
demo: true

# Pár vět o roce za sebe (jaký byl, co se v tvorbě dělo); zobrazí se nahoře na stránce roku /tvorba/<rok>/.
# Víc řádků: napiš description: | a pod to text odsazený dvěma mezerami. Prázdné "" = bez textu.
description: ""

# DOPLNIT Vybraný úvodní obraz: id díla z toho roku (např. k3f9a), nebo jeho detailní fotka (k3f9a#1-kvet), bez mezer;
# vede na to dílo. Nebo místo toho vlastní fotka <rok>.jpg vedle tohoto souboru (bez odkazu). Ukáže se celý, s focus oříznutý na 3:2.
# Prázdné = náhodně jeden z 10 nejnovějších obrazů ve výběru autorky (featured), celý, bez ořezu.
cover: ""

# UKÁZKA: vlastní úvodní fotka roku (roky/2025.jpg, široké panorama), ukáže se celá, bez ořezu
# Jen s cover: vybraný obraz se ořízne na 3:2 a [zleva %, shora %] = co zůstane vidět, např. [50, 50] = střed,
# [80, 30] = vpravo nahoře. Prázdné = obraz celý, bez ořezu. Bez cover (i s vlastní fotkou) nechat prázdné.
focus:

# DOPLNIT Soukromá poznámka, zůstane jen v tomto repu, na web se nikdy nedostane.
private_note: ""
