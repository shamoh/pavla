# Město v dešti, celý obraz
# NEPOVINNÉ. Vybraný úvodní obraz: id díla z kolekce (např. k3f9a), nebo jeho detailní fotka (k3f9a#1-kvet), bez mezer;
# vede na to dílo. Nebo místo toho vlastní fotka _uvod.jpg (bez odkazu). Ukáže se celý, s aspect nebo focus oříznutý.
