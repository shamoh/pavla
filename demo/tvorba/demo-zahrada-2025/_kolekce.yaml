# Jen testovací data (repo pavla, složka demo/): true = testovací položka. Ve skutečném obsahu být nesmí.
demo: true

# Název kolekce na webu, např. Plenér Šumava 2026.
title: Ze zahrady 2025

# Pár vět o kolekci: kde a kdy obrazy vznikly. Víc řádků pod sebou, odsazených dvěma mezerami.
description: |
  Květiny ze zahrady a z louky za domem. Úvodní obraz je široký detail Pivoněk.

# detail Pivoněk; jen "vjr39" = celý obraz; bez řádku = nejnovější obraz (Kytice z louky)
# Vybraný úvodní obraz: id díla z kolekce (např. k3f9a), nebo jeho detailní fotka (k3f9a#1-kvet), bez mezer;
# vede na to dílo. Nebo místo toho vlastní fotka _uvod.jpg (bez odkazu). Ukáže se celý, s focus oříznutý na 3:2.
# Prázdné = náhodně jeden z 10 nejnovějších obrazů ve výběru autorky (featured), celý, bez ořezu.
cover: vjr39#1-kvety-nahore

# úvodní obraz se ořízne na 3:2, tohle místo zůstane vidět
# Jen s cover: vybraný obraz se ořízne na 3:2 a [zleva %, shora %] = co zůstane vidět, např. [50, 50] = střed,
# [80, 30] = vpravo nahoře. Prázdné = obraz celý, bez ořezu. Bez cover (i s vlastní fotkou) nechat prázdné.
focus: [50, 40]

# Soukromá poznámka, zůstane jen v tomto repu, na web se nikdy nedostane.
private_note: ""
