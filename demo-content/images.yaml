# Recept na obrázky testovacích dat (npm run demo). Obrázky se negenerují do gitu, ale při každém
# `npm run demo` znovu a vždy stejně (pevný seed): abstraktní „akvarelové“ skvrny na papíře.
#   <cesta>: { size: [šířka, výška], palette: <paleta>, seed: <číslo> }       nový obrázek
