# NEPOVINNÉ. Ořez vybraného obrazu (cover nebo vlastní fotky) na poměr stran šířka:výška v uvozovkách, např. "3:2", "2:1",
# "1:1". Jen s focus = "1:1". Bez aspect i focus = celý.
# aspect: "3:2"

# Text tlačítka pod textem úvodní stránky, které vede na celou tvorbu. Povinné.
button: Prohlédnout tvorbu

# NEPOVINNÉ. Vybraný úvodní obraz: id díla z celé tvorby (např. k3f9a), nebo jeho detailní fotka (k3f9a#1-kvet), bez mezer;
# vede na to dílo. Nebo místo toho vlastní fotka _cover.jpg vedle tohoto souboru (bez odkazu). Ukáže se celý, s aspect nebo focus oříznutý.
# Prázdné = náhodně jeden z 10 nejnovějších obrazů ve výběru autorky (featured), celý, bez ořezu.
# cover: k3f9a

# NEPOVINNÉ. Popis pro vyhledávače a náhled odkazu (Google, Facebook, WhatsApp): jedna nebo dvě věty, nejvýš
# 160 znaků, bez formátování; na stránce se neukáže. Prázdné = začátek textu.
# description: Jedna nebo dvě věty pro Google, nejvýš 160 znaků.

# Menší věta pod ní (dokud není žádný obraz).
# Piš ji pod „empty_closing: |“, každý řádek odsazený dvěma mezerami:
#   - řádky zalamuj, kde chceš: na webu se spojí mezerou (příliš dlouhé zalomí automatika),
#   - prázdný řádek = nový odstavec,
#   - prázdné "" = nic.
# Formátování:
#   - **slovo** = tučně,
#   - *slovo* = kurzívou,
#   - [text](/tvorba/) = odkaz na stránku tohoto webu (adresa začíná /),
#   - [text](https://…) = odkaz na jiný web, [text](mailto:…) = odkaz na e-mail.
empty_closing: |
  Než je sem nahraji, co právě maluji, najdete [na Instagramu](https://www.instagram.com/pavla.kramolisova/).

# Velká věta na úvodní stránce, dokud na webu není žádný obraz (místo velkého obrazu). Povinné.
empty_text: Obrazy tu brzy přibudou.

# NEPOVINNÉ. Při ořezu vybraného obrazu zůstane vidět [zleva %, shora %], např. [50, 50] = střed, [80, 30] = vpravo nahoře.
# Jen s aspect = střed. Náhodný obraz se neořezává.
# focus: [50, 50]

# Velký nadpis úvodní stránky; každý řádek je řádek nadpisu (odsazený dvěma mezerami pod „heading: |“).
# Povinné.
heading: |
  Testovací nadpis
  na dva řádky

# Text na úvodní stránce vedle velkého obrazu (pod nadpisem).
# Piš ho pod „text: |“, každý řádek odsazený dvěma mezerami:
#   - řádky zalamuj, kde chceš: na webu se spojí mezerou (příliš dlouhé zalomí automatika),
#   - prázdný řádek = nový odstavec,
#   - prázdné "" = bez textu.
# Formátování:
#   - **slovo** = tučně,
#   - *slovo* = kurzívou,
#   - [text](/tvorba/) = odkaz na stránku tohoto webu (adresa začíná /),
#   - [text](https://…) = odkaz na jiný web, [text](mailto:…) = odkaz na e-mail.
text: |
  Maluji hlavně akvarelem — v kroužku, na plenérech a doma u stolu. Tady najdete, co mi právě
  uschlo na papíře, i to, co už visí jinde. (Testovací text z demo-content/_index.yaml.)

# NEPOVINNÉ. Soukromá poznámka, zůstane jen v tomto repu, na web se nikdy nedostane.
# private_note: kde obraz visí, komu patří
