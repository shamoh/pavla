# Rohy listu na fotce: všechno vně čtyřúhelníku (podlaha) bude na webu průhledné. Najde je pipeline, smíš je
# upravit. photo = [šířka, výška] fotky; tl/tr/br/bl = levý horní, pravý horní, pravý dolní, levý dolní roh jako
# [px vodorovně, px svisle] od toho rohu fotky směrem dovnitř, např. tl: [40, 25]. false = nic neořezávat.
# Po výměně fotky za jinou velikost atribut smaž, pipeline rohy najde znovu.
meta_corners:
  photo: [1800, 2400]
  tl: [0, 0]
  tr: [0, 0]
  br: [0, 0]
  bl: [0, 0]

# true = rozpracovaný, na webu se nezobrazí; false = zveřejnit.
meta_draft: false

# testovací data: exporty pro Instagram (originál a detaily)
# true = připravit fotky pro Instagram (export/instagram: originál a detailní fotky); false = žádné.
meta_instagram: true

# Trvalý kód obrazu: podle něj web pozná obraz i po přejmenování (krátká adresa /tvorba/<id>/).
# Generuje ho pipeline, NIKDY neměnit. Hodí se napsat tužkou na zadní stranu obrazu.
id: vjr39

# Den vzniku ve tvaru 2026-06-14. Rok z něj určuje rok obrazu na webu (stránka roku, adresa).
date: 2025-05-28

# Pár vět o obraze, zobrazí se na jeho stránce. Víc řádků pod sebou, odsazených dvěma mezerami.
description: |
  Pivoňky ze zahrady, malované hned ráno, dokud byly celé.

# NEPOVINNÉ. Popisky detailních fotek ze složky se jménem obrazu (vedle tohoto souboru): { název fotky: popisek, … }.
details:
  1-kvety-nahore: Rozvité květy, široký výřez (úvodní obraz kolekce Ze zahrady 2025)

# true = ve výběru autorky: filtr „Výběr autorky“ v galerii; z 10 nejnovějších vybraných se náhodně
# střídají obrazy nahoře na úvodní stránce, stránce roku a na úvodu kolekce (bez cover). false = ne.
featured: true

# NEPOVINNÉ. Odkaz na obraz na Fleru (https://www.fler.cz/…). U obrazu na prodej s ním web ukáže tlačítko „Koupit na Fleru“.
# fler: https://www.fler.cz/zbozi/…

# testovací data: mockupy vypnuté výslovně
# true = mockupy (obraz v rámu v interiéru) na webu, u obrazu na prodej i pro Fler; false = žádné.
mockups: false

# NEPOVINNÉ. Cena v Kč, např. 2500. Povinná u available a reserved.
price: 2800

# Šířka × výška v cm, např. [30, 40]. Povinné u zveřejněného obrazu:
# podle rozměrů se dělají mockupy ve skutečné velikosti.
size_cm: [30, 40]

# Stav prodeje: available (k prodeji) | reserved (rezervováno) | sold (prodáno)
# | not-for-sale (není na prodej, na webu bez štítku).
status: available

# NEPOVINNÉ. Podklad, např. papír Arches 300 g. Bez něj se na webu nezobrazí.
support: papír Arches 300 g

# Štítky pro filtr v galerii, např. [krajina, voda, plenér]. Prázdné = [].
tags: [květiny]

# Technika, např. akvarel, kresba tužkou, linoryt, kombinovaná technika. Podle ní se filtruje v galerii.
technique: akvarel

# Název obrazu, jak ho uvidí návštěvníci webu.
title: Pivoňky

# NEPOVINNÉ. Soukromá poznámka, zůstane jen v tomto repu, na web se nikdy nedostane.
# private_note: kde obraz visí, komu patří
