# UKÁZKA: ořez na široký formát 2:1 (zkus "3:2"), tohle místo zůstane vidět
# NEPOVINNÉ. Ořez vybraného obrazu (cover nebo vlastní fotky) na poměr stran šířka:výška v uvozovkách, např. "3:2", "2:1",
# "1:1". Jen s focus = "1:1". Bez aspect i focus = celý.
aspect: "2:1"

# detail Pivoněk; jen "vjr39" = celý obraz; bez řádku = nejnovější obraz (Kytice z louky)
# NEPOVINNÉ. Vybraný úvodní obraz: id díla z kolekce (např. k3f9a), nebo jeho detailní fotka (k3f9a#1-kvet), bez mezer;
# vede na to dílo. Nebo místo toho vlastní fotka _cover.jpg (bez odkazu). Ukáže se celý, s aspect nebo focus oříznutý.
# Prázdné = náhodně jeden z 10 nejnovějších obrazů ve výběru autorky (featured), celý, bez ořezu.
cover: vjr39#1-kvety-nahore

# Pár vět o kolekci: kde a kdy obrazy vznikly. Víc řádků pod sebou, odsazených dvěma mezerami.
description: |
  Květiny ze zahrady a z louky za domem. Úvodní obraz je široký detail Pivoněk.

# NEPOVINNÉ. Při ořezu vybraného obrazu zůstane vidět [zleva %, shora %], např. [50, 50] = střed, [80, 30] = vpravo nahoře.
# Jen s aspect = střed. Náhodný obraz se neořezává.
focus: [50, 40]

# Název kolekce na webu, např. Plenér Šumava 2026.
title: Ze zahrady 2025

# NEPOVINNÉ. Soukromá poznámka, zůstane jen v tomto repu, na web se nikdy nedostane.
# private_note: kde obraz visí, komu patří
