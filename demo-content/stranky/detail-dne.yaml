# Kvíz (/detail-dne/muj/, otevře ho poslaný odkaz): návod, když se stránka otevře bez odkazu (i pod hláškou o špatném odkazu); editor u obrazu mimo hru ukáže odstavce od druhého.
# Piš ho pod „quiz_text: |“, každý řádek odsazený dvěma mezerami:
#   - řádky zalamuj, kde chceš: na webu se spojí mezerou (příliš dlouhé zalomí automatika),
#   - prázdný řádek = nový odstavec,
#   - prázdné "" = bez textu.
# Formátování:
#   - **slovo** = tučně,
#   - *slovo* = kurzívou,
#   - [text](/tvorba/) = odkaz na stránku tohoto webu (adresa začíná /),
#   - [text](k3f9a) = odkaz na jiný obraz podle jeho kódu id, [](k3f9a) = s jeho názvem jako textem odkazu
#     (rozpracovaný obraz zůstane bez odkazu),
#   - [text](https://…) = odkaz na jiný web, [text](mailto:…) = odkaz na e-mail.
quiz_text: |
  Tady se hraje kvíz, který si někdo připravil z jednoho obrazu a poslal odkazem: poznáš, ze kterého
  obrazu je výřez?

  Vlastní kvíz si uděláš taky: otevři v [Tvorbě](/tvorba/) obraz, který se ti líbí, a u něj zvol
  **Udělat z obrazu Můj Detail dne**. Vybereš obtížnost, místo výřezu a zkreslení a odkaz pošleš komu chceš.

  Každý den jsou tři nové výřezy v [Detailu dne](/detail-dne/), tam se sbírají i kapky a hodnosti.

# Stránka obrazu: odkaz pod „Sdílet“, otevře editor kvízu (jen obraz ve hře). Jeden řádek bez formátování, povinné.
work_link: Zahrát si s tímhle obrazem

