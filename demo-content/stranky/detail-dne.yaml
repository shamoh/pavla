# Editor kvízu (/detail-dne/muj-kviz/, otevře ho odkaz na stránce obrazu): text pod větou „Kvíz z obrazu …“ (název obrazu doplní web).
# Piš ho pod „editor_text: |“, každý řádek odsazený dvěma mezerami:
#   - řádky zalamuj, kde chceš: na webu se spojí mezerou (příliš dlouhé zalomí automatika),
#   - prázdný řádek = nový odstavec,
#   - prázdné "" = bez textu.
# Formátování:
#   - **slovo** = tučně,
#   - *slovo* = kurzívou,
#   - [text](/tvorba/) = odkaz na stránku tohoto webu (adresa začíná /),
#   - [text](k3f9a) = odkaz na jiný obraz podle jeho kódu id, [](k3f9a) = s jeho názvem jako textem odkazu
#     (rozpracovaný obraz zůstane bez odkazu),
#   - [text](https://…) = odkaz na jiný web, [text](mailto:…) = odkaz na e-mail.
editor_text: |
  Vyber obtížnost, místo výřezu a zkreslení, pak odkaz pošli komu chceš: uvidí přesně tenhle kvíz.
  Vlastní kvíz nedává kapky.

