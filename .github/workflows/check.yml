# Checks that nothing stopped working after a change of the code: unit tests and a build of the site from
# the committed data (it also compiles every page template), and the workflows themselves (actionlint). The site from the test data (`npm run demo:build`)
# is not built here: it takes minutes on a GitHub runner and is never published; build it locally instead.
# A push of content updates (content/, public/ generated data) or documentation to main does not trigger it,
# but every pull request does: it is the required check of the ruleset on main, so a content pull request (auto-merge)
# is merged only when the site still builds.
# A failure on a push to main, or on the content pull request (branch obsah/aktualizace, it would otherwise just
# never merge), opens an issue assigned to the repository owner (.github/failure-issue.sh), so he gets an e-mail;
# the next passing run of the same kind closes it.
name: Kontrola kódu

on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'
      - 'public/tvorba/**'
      - 'public/fotky/**'
      - 'public/_cover/**'
      - 'public/og.jpg'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the running check.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build

  # Syntax, expressions, action inputs and shell scripts (shellcheck) of every workflow in this repo.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: shellcheck of the helper scripts
        run: shellcheck .github/*.sh

  # The issue of a failed check (see the top): only for a push to main and for the content pull request; other pull
  # requests and manual runs are watched by whoever started them. A run cancelled by a newer push does nothing.
  notify:
    needs: [check, workflows]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref == 'obsah/aktualizace'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Open or update the issue (sends an e-mail), or close it when the check passed
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            .github/failure-issue.sh "Aktualizace obsahu neprošla kontrolou kódu" "$FAILED" "Běh: $RUN_URL
          Pull request: $PR_URL

          Testy nebo build webu s novým obsahem selhaly, pull request se proto sám nesloučí. Podrobnosti jsou v běhu."
          else
            .github/failure-issue.sh "Kontrola kódu na main selhala" "$FAILED" "Běh: $RUN_URL
          Commit: ${GITHUB_SHA::7}

          Testy, build webu nebo kontrola workflow na main selhaly. Podrobnosti jsou v běhu."
          fi
