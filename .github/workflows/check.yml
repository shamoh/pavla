# Checks that nothing stopped working after a change of the code: unit tests and a build of the site from
# the committed data (it also compiles every page template). The site from the test data (`npm run demo:build`)
# is not built here: it takes minutes on a GitHub runner and is never published; build it locally instead.
# Content updates from pavla-content (content/, public/ generated data) and documentation do not trigger it.
name: Kontrola kódu

on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'
      - 'public/works/**'
      - 'public/photos/**'
      - 'public/collections/**'
      - 'public/og/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'content/**'
      - 'public/works/**'
      - 'public/photos/**'
      - 'public/collections/**'
      - 'public/og/**'
      - '**/*.md'
  workflow_dispatch:

# A newer push to the same branch cancels the running check.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build
