# Centrální konfigurace webu a obrázkové pipeline.
# Většinu věcí, které se budou měnit, najdeš tady.

site:
  url: https://pavla.kramolis.cz         # musí sedět s public/CNAME
  title: Pavla Kramolišová
  tagline: Akvarely pro radost
  author: Pavla Kramolišová
  email: pavla@kramolis.cz
  location: Roztoky                       # kde Pavla žije a maluje, zobrazí se v Kontaktu; prázdné = nic
  instagram: pavla.kramolisova
  fler: ""                               # URL obchůdku na Fleru, až bude
  verification:                          # ověření webu u vyhledávačů značkou <meta> (jen když ověřuješ touto cestou,
    google: ""                           #   DNS záznam ji nepotřebuje): kód z Google Search Console,
    bing: ""                             #   z Bing Webmaster Tools (msvalidate.01)
    seznam: "pRmNbOEUVpe5jyTrqNiBs8sNsD5d9jP9"   #   a ze Seznam Webmaster (seznam-wmt); prázdné = žádná značka

analytics:
  # Google Analytics 4 (služba pavla.kramolis.cz), měří jen produkční build skutečného webu,
  # ne `npm run dev` ani web z testovacích dat. Prázdné = bez statistik. Ukládá cookies _ga.
  googleMeasurementId: G-HPZNHYZ2MQ

messages:
  # Zprávy od návštěvníků (formulář na Kontaktu a panel „Napište mi“ na ostatních stránkách) posílá Web3Forms
  # e-mailem. accessKey = klíč z web3forms.com (veřejný, říká jen, kam zprávu doručit). Prázdné = bez formuláře
  # (Kontakt ukáže jen adresu). Web z testovacích dat ukáže vždy jen náhled, který nic neodesílá.
  accessKey: 667747d9-fb8d-4d52-9af7-d622adef05a0

gallery:
  pageSizes: [12, 24, 48]                # počty děl na stránku, které si návštěvník může vybrat; první je výchozí

images:
  # Originály fotek a popisy děl jsou v odděleném obsahovém repu (tvorba/, fotky/). Jeho cestu určuje
  # proměnná CONTENT_DIR (lokálně v souboru .env, mimo git; viz README).
  web:
    widths: [480, 960, 1600, 2400]
    quality: 82
  mockups:
    widths: [480, 960, 1600]             # velikosti mockupů na webu (výběr scén: mockups/scenes.yaml)
  details:
    widths: [480, 960, 1600, 2400]       # detailní fotky díla (tvorba/<rok>/<slug>/)
  photos:
    widths: [480, 960, 1600, 2400]       # ostatní fotky webu (fotky/ obsahového repa) a úvodní fotky kolekcí
  og:                                    # obrázky pro sdílení (og:image), 3:2
    width: 1200
    height: 800
    quality: 85
    background: "#f4f1ea"                # dílo: celý obraz na papírovém pozadí (neořezává se)
    padding: 0.06                        # okraj kolem díla (podíl výšky); kolekce: ořez jako na stránce
  instagram:
    width: 1080
    height: 1350                         # 4:5, nejvíc místa ve feedu
    background: "#f4f1ea"                # teplý papírový odstín
    padding: 0.08                        # okraj kolem obrazu (podíl šířky)
  fler:
    longEdge: 2000
    quality: 90
    watermark: Pavla Kramolišová         # jen jméno, žádný odkaz ven (pravidla Fleru)
    watermarkOpacity: 0.55
    background: "#ffffff"                # místo průhledného okolí díla (podlahy vně rohů listu)
  edges:                                 # ořez podlahy podle rohů listu (meta_corners), viz README „Ořez podlahy“
    feather: 0.01                        # šířka prolnutí hrany s pozadím (podíl kratší strany)
    inset: 0.002                         # o kolik víc oříznout dovnitř listu (podíl kratší strany)
    search: 0.1                          # jak daleko od okraje fotky hledat hranu listu (podíl rozměru)
    suspicious: 0.05                     # roh, který ořízne víc (podíl šířky / výšky), je v náhledech podezřelý (červeně, !)
