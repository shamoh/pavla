# Centrální konfigurace webu a obrázkové pipeline.
# Většinu věcí, které se budou měnit, najdeš tady.

site:
  url: https://pavla.kramolis.cz         # musí sedět s public/CNAME
  title: Pavla Kramolišová
  tagline: Akvarely a kresby
  author: Pavla Kramolišová
  email: ""                              # doplnit, zobrazí se v Kontaktu
  instagram: pavla.kramolisova
  fler: ""                               # URL obchůdku na Fleru, až bude

images:
  # Originály fotek a popisy děl jsou v soukromém repu pavla-content (tvorba/<rok>/<slug>.yaml + fotka).
  # Cesta je relativní k tomuto repu; lze přepsat proměnnou CONTENT_DIR.
  contentDir: ../pavla-content
  web:
    widths: [480, 960, 1600, 2400]
    quality: 82
  mockups:
    widths: [480, 960, 1600]             # velikosti mockupů na webu (výběr scén: mockups/scenes.yaml)
  photos:
    widths: [480, 960, 1600, 2400]       # ostatní fotky webu (pavla-content/fotky/)
  instagram:
    width: 1080
    height: 1350                         # 4:5, nejvíc místa ve feedu
    background: "#f4f1ea"                # teplý papírový odstín
    padding: 0.08                        # okraj kolem obrazu (podíl šířky)
  fler:
    longEdge: 2000
    quality: 90
    watermark: Pavla Kramolišová         # jen jméno, žádný odkaz ven (pravidla Fleru)
    watermarkOpacity: 0.55
