text: >
  Rok, kdy jsme si náš akvarelový kurz vytvářely samy, bez lektorky, která nás v
  tom roce nemohla vést. Láska k akvarelu v naší skupině

  zvítězila. Na každou hodinu jsme si vymyslely téma a jedna z nás připravila
  lekci pro ostatní.
title: Akvarelový salón 2024
