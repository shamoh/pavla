text: >
  Maluji pro radost. Je to moje velká vášeň a dlouholetý koníček – chvíle,

  kdy se svět zpomalí a zbyde jen papír, barva a voda.


  Výtvarné aktivity mám ráda od malička, ale jako pravý Blíženec jsem měla vždy
  i hodně jiných zájmů:

  zpěv, hra na kytaru (později i ukulele), divadlo, čtení, zumba, tanec a jiné
  sporty.


  Hlubší zájem o malování ve mně znova probudil přípravný kurz na vysokou školu
  u paní učitelky Jany Bajerové

  z mého domovského gymnázia. Začala jsem ve volném čase zkoušet všechny možné
  techniky, včetně malování olejovými barvami na plátno.


  Posledních pár let mě ale naprosto pohltily akvarelové barvy. Začalo to v roce
  2019, kdy jsem se účastnila víkendových

  kurzů s malířkou Kamilou Havlíkovou a pak pokračovala pod jejím vedením na
  pravidelných týdenních

  akvarelových kurzech a několikadenních plenérech.


  Na akvarelu mě baví, že se nedá úplně ovládat: voda si vždycky trochu dělá, co
  chce, a právě to bývá největší výzvou

  a zároveň často největším impulzem pro ty nejhezčí obrazy.


  Nejraději maluji a kreslím na procházkách v přírodě, hlavně krajinu a zvířata
  – a ta nejlépe v pohybu. Obrazy

  a skicy tvořím převážně akvarelem, někdy fixem, brush penem či tužkou, podle
  toho, co si zrovna žádá chvíle.


  Kdykoli mám volnou chvilku, cvičím si ruku i oko slepou kresbou: kreslím lidi
  a zvířata, pozoruji zobrazovaný

  objekt a na papír se přitom vůbec nedívám.
