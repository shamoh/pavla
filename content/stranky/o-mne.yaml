text: >
  Maluji pro radost. Je to moje velká vášeň a dlouholetý koníček – chvíle, kdy
  se svět zpomalí

  a zbude jen papír, barva a voda.


  Posledních pár let mě nejvíc chytil akvarel. Baví mě, že se nedá úplně
  ovládat: voda si vždycky

  trochu dělá, co chce, a právě to bývá na obraze nejhezčí.


  Nejraději maluji na procházkách v přírodě, hlavně krajinu a zvířata – a ta
  nejlépe v pohybu.

  Obrazy a skicy tvořím převážně akvarelem, někdy fixem, brush penem či tužkou,
  podle toho, co si

  zrovna žádá chvíle.


  Kdykoli mám volnou chvilku, cvičím si ruku i oko slepou kresbou: kreslím lidi
  a zvířata

  a na papír se přitom vůbec nedívám.
