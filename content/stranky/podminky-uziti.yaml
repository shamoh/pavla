description: >
  Obrazy, fotky a texty na tomto webu jsou moje autorská díla. Co s nimi smíte a
  kdy mě požádat o svolení.
text: >
  Všechny obrazy, kresby, fotky a texty na tomto webu jsou moje autorská díla a
  chrání je autorský

  zákon. Všechna práva vyhrazena.


  **Sdílení je vítané:** odkaz na stránku obrazu můžete poslat komukoli a sdílet
  ho na sociálních

  sítích nebo na Pinterestu. Sdílí se odkaz s náhledem, obraz zůstává tady.


  **Bez mého svolení prosím ne:** stahovat a dál šířit obrázky obrazů, tisknout
  je, upravovat, používat

  je v jiných dílech, na výrobcích nebo v reklamě, ani je používat k učení umělé
  inteligence.


  Koupí originálu získáte obraz samotný, ne právo ho dál rozmnožovat (tisky,
  pohlednice, obrázky).
text_en: >
  All paintings, drawings, photos and texts on this website are my original
  works, protected by copyright.

  All rights reserved.


  **Sharing is welcome:** you may send a link to the page of a painting to
  anyone and share it on social networks

  or on Pinterest. A link with a preview is shared, the painting stays here.


  **Please not without my permission:** downloading and further distributing the
  pictures of the paintings,

  printing them, editing them, using them in other works, on products or in
  advertising, or for training

  artificial intelligence.


  Buying an original gives you the painting itself, not the right to reproduce
  it (prints, postcards, pictures).


  Would you like to use a painting in another way? [Write to me](/kontakt/) and
  we will find a way.
